version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kos-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - kos-network

  web:
    image: nginx:alpine
    container_name: kos-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - kos-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: kos-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kos_kosan
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: kos_user
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - kos-network

networks:
  kos-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
